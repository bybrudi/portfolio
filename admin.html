<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BY BRUDI - Admin Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 🍷 기본 배경은 체리레드, 잠금 상태일 때는 스크롤 차단 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #7A0C1E; 
            color: #FFFDF9; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 40px 20px; 
            overflow-x: hidden;
        }

        /* ==========================================
           🔒 미니멀 잠금 화면 (Lock Screen) 디자인
           ========================================== */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #7A0C1E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .lock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            opacity: 0;
            transform: translateY(15px);
            animation: slowAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slowAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 자물쇠 이모지 스타일 */
        .lock-icon {
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
        }

        /* 미니멀한 빈 원형 슬롯 6개 */
        .pin-dots {
            display: flex;
            gap: 16px; /* 원들 사이의 여유로운 간격 */
            align-items: center;
        }

        .pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 253, 249, 0.4); /* 빈 원형 테두리 */
            background: transparent;
            transition: all 0.25s ease;
        }

        /* 숫자가 입력될 때 채워지는 원 (크림 아이보리) */
        .pin-dot.filled {
            background: #FFFDF9;
            border-color: #FFFDF9;
            transform: scale(1.1);
        }

        /* 틀렸을 때 좌우로 흔들리는 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .pin-dots.shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 숨겨진 실제 입력 필드 (포커스 유지용) */
        #pinInput {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* ==========================================
           🛠️ 관리자 대시보드 화면 (로그인 후 노출)
           ========================================== */
        #adminDashboard {
            width: 100%;
            max-width: 650px;
            opacity: 0;
            display: none;
            transition: opacity 0.8s ease;
        }

        #adminDashboard.unlocked {
            display: block;
            opacity: 1;
        }

        .admin-card { background: #fff; border-radius: 16px; padding: 32px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); color: #1d1d1f; }
        
        h2 { font-size: 20px; margin-bottom: 24px; color: #1d1d1f; text-align: center; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 600; color: #6e6e73; display: block; margin-bottom: 8px; }
        input[type="text"], select, textarea, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; outline: none; background: #fff; font-family: inherit; color: #1d1d1f; }
        textarea { resize: vertical; height: 100px; }
        
        .file-input-wrap { display: flex; gap: 8px; align-items: center; }
        .file-input-wrap input[type="file"] { flex: 1; }
        .btn-file-clear { padding: 12px 16px; background: #ff3b30; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .btn-file-clear:hover { background: #d70015; }

        .radio-group { display: flex; gap: 20px; margin-top: 6px; }
        .radio-label { font-weight: normal; font-size: 14px; color: #333; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .btn-submit { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 10px; background: #888; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; display: none; }
        
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 12px 16px; border-radius: 8px; border: 1px solid #eee; }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-info img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .item-actions { display: flex; gap: 6px; }
        .btn-edit { background: #0071e3; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-del { background: #ff3b30; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body onclick="document.getElementById('pinInput').focus()">

    <!-- 🔒 미니멀 슬로우 잠금 화면 -->
    <div id="lockScreen">
        <div class="lock-container">
            <div class="lock-icon">🔒</div>
            <div class="pin-dots" id="pinDots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
        </div>
        <!-- 실제 입력 포커스를 받기 위한 투명 입력창 (숫자 6자리 제한) -->
        <input type="password" id="pinInput" maxlength="6" autofocus>
    </div>

    <!-- 🛠️ 관리자 대시보드 메인 내용 -->
    <div id="adminDashboard">
        <div class="admin-wrap">
            <div class="admin-card">
                <h2 id="formTitle">작품 업로드</h2>
                <form id="uploadForm">
                    <input type="hidden" id="editId">
                    <input type="hidden" id="removeConsultImageFlag" value="false">
                    
                    <div class="form-group">
                        <label>작품 제목</label>
                        <input type="text" id="title" placeholder="예: 네이버 쇼핑 라이브 배너" required>
                    </div>

                    <div class="form-group">
                        <label>설명 텍스트 (줄바꿈 반영)</label>
                        <textarea id="description" placeholder="작품 관련 설명을 입력해 주세요."></textarea>
                    </div>

                    <div class="form-group">
                        <label>대카테고리</label>
                        <select id="mainCat">
                            <option value="WEB">WEB</option>
                            <option value="PRINT">PRINT</option>
                            <option value="OTHER">OTHER</option>
                            <option value="PRICE">PRICE</option>
                            <option value="CONTACT">CONTACT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>소카테고리 (WEB 선택 시)</label>
                        <select id="subCat">
                            <option value="BANNER">BANNER</option>
                            <option value="DETAIL">DETAIL</option>
                            <option value="PHOTO">PHOTO</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>상담 내역 캡처 이미지 선택 (선택 사항)</label>
                        <div class="file-input-wrap">
                            <input type="file" id="consultFile" accept="image/*">
                            <button type="button" class="btn-file-clear" onclick="clearConsultFile()">삭제</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>메인 시안 등록 방식 선택</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="viewType" value="file" checked onclick="toggleType('file')"> 이미지 파일 직접 업로드
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="viewType" value="tistory" onclick="toggleType('tistory')"> 티스토리 상세 링크 입력
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="fileInputArea">
                        <label>실제 메인 배너/시안 이미지 선택</label>
                        <input type="file" id="bannerFile" accept="image/*">
                    </div>

                    <div class="form-group" id="tistoryInputArea" style="display: none;">
                        <label>티스토리 상세페이지 링크 (URL)</label>
                        <input type="text" id="detailUrl" placeholder="https://brudi.tistory.com/entry/gif-상세페이지">
                        <label style="margin-top: 10px;">목록용 썸네일 이미지 선택 (필수)</label>
                        <input type="file" id="thumbFile" accept="image/*">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">등록하기</button>
                    <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">수정 취소</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>등록된 작품 목록</h2>
                <div class="item-list" id="itemList"></div>
            </div>
        </div>
    </div>

<script>
    // 🔑 
    const ADMIN_PIN = "202610"; 

    const pinInput = document.getElementById('pinInput');
    const pinDots = document.getElementById('pinDots');
    const lockScreen = document.getElementById('lockScreen');
    const adminDashboard = document.getElementById('adminDashboard');
    const dots = pinDots.querySelectorAll('.pin-dot');

    // 화면 아무 곳이나 누르면 항상 비밀번호 입력창에 포커스 유지
    window.addEventListener('click', () => {
        pinInput.focus();
    });

    // 비밀번호 입력 감지 및 인터랙션
    pinInput.addEventListener('input', (e) => {
        const val = pinInput.value;
        
        // 동그라미 채우기 상태 업데이트
        dots.forEach((dot, index) => {
            if (index < val.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        });

        // 6자리가 모두 채워졌을 때 검증
        if (val.length === 6) {
            if (val === ADMIN_PIN) {
                // 성공 시: 잠금 화면 부드럽게 페이드 아웃 후 대시보드 오픈
                lockScreen.style.opacity = '0';
                lockScreen.style.visibility = 'hidden';
                adminDashboard.classList.add('unlocked');
                document.body.style.background = '#f5f5f7'; // 관리자 창 배경은 깔끔한 라이트톤으로 전환
            } else {
                // 실패 시: 흔들림 효과 후 입력창 초기화
                pinDots.classList.add('shake');
                setTimeout(() => {
                    pinDots.classList.remove('shake');
                    pinInput.value = '';
                    dots.forEach(dot => dot.classList.remove('filled'));
                }, 400);
            }
        }
    });

    // 기존 어드민 기능 스크립트
    const uploadForm = document.getElementById('uploadForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const editIdInput = document.getElementById('editId');
    const removeConsultImageFlag = document.getElementById('removeConsultImageFlag');
    const titleInput = document.getElementById('title');
    const descInput = document.getElementById('description');
    const mainCatInput = document.getElementById('mainCat');
    const subCatInput = document.getElementById('subCat');
    const consultFileInput = document.getElementById('consultFile');
    const bannerFileInput = document.getElementById('bannerFile');
    const thumbFileInput = document.getElementById('thumbFile');
    const detailUrlInput = document.getElementById('detailUrl');

    function toggleType(type) {
        if (type === 'file') {
            document.getElementById('fileInputArea').style.display = 'block';
            document.getElementById('tistoryInputArea').style.display = 'none';
        } else {
            document.getElementById('fileInputArea').style.display = 'none';
            document.getElementById('tistoryInputArea').style.display = 'block';
        }
    }

    function clearConsultFile() {
        consultFileInput.value = '';
        removeConsultImageFlag.value = 'true';
        alert('상담 내역 캡처 이미지가 비워졌습니다. ✨');
    }

    function getSafeItems() {
        const rawItems = JSON.parse(localStorage.getItem('bybrudi_portfolio') || '[]');
        return rawItems.map(item => ({
            id: item.id,
            title: item.title || '',
            description: item.description || '',
            mainCat: item.mainCat || 'WEB',
            subCat: item.subCat || 'BANNER',
            consultImage: item.consultImage || '',
            viewType: item.viewType || 'file',
            detailUrl: item.detailUrl || '',
            image: item.image || ''
        }));
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    uploadForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const title = titleInput.value.trim();
        const description = descInput.value;
        const mainCat = mainCatInput.value;
        const subCat = subCatInput.value;
        const editId = editIdInput.value;
        const viewType = document.querySelector('input[name="viewType"]:checked').value;
        const detailUrl = detailUrlInput.value.trim();

        const consultFile = consultFileInput.files[0];
        const bannerFile = bannerFileInput.files[0];
        const thumbFile = thumbFileInput.files[0];

        try {
            const consultImgResult = await readFileAsDataURL(consultFile);
            const bannerImgResult = await readFileAsDataURL(bannerFile);
            const thumbImgResult = await readFileAsDataURL(thumbFile);

            let items = getSafeItems();
            const existingItem = editId ? items.find(i => Number(i.id) === Number(editId)) : null;

            let finalImage = '';
            if (viewType === 'file') {
                finalImage = bannerImgResult || (existingItem ? existingItem.image : '');
            } else {
                finalImage = thumbImgResult || (existingItem ? existingItem.image : '');
            }

            if (!editId && !finalImage) {
                alert('목록용 대표 이미지 선택은 필수입니다.');
                return;
            }

            if (editId) {
                const targetIndex = items.findIndex(item => Number(item.id) === Number(editId));
                if (targetIndex !== -1) {
                    items[targetIndex].title = title;
                    items[targetIndex].description = description;
                    items[targetIndex].mainCat = mainCat;
                    items[targetIndex].subCat = subCat;
                    items[targetIndex].viewType = viewType;
                    items[targetIndex].detailUrl = detailUrl;

                    if (removeConsultImageFlag.value === 'true') {
                        items[targetIndex].consultImage = '';
                    } else if (consultImgResult) {
                        items[targetIndex].consultImage = consultImgResult;
                    }

                    if (finalImage) items[targetIndex].image = finalImage;

                    localStorage.setItem('bybrudi_portfolio', JSON.stringify(items));
                    alert('작품이 정상적으로 수정되었습니다! ✏️');
                }
            } else {
                const newItem = {
                    id: Date.now(),
                    title: title,
                    description: description,
                    mainCat: mainCat,
                    subCat: subCat,
                    consultImage: (removeConsultImageFlag.value === 'true') ? '' : (consultImgResult || ''),
                    viewType: viewType,
                    detailUrl: detailUrl,
                    image: finalImage
                };

                items.unshift(newItem);
                localStorage.setItem('bybrudi_portfolio', JSON.stringify(items));
                alert('작품이 정상적으로 등록되었습니다! 🎉');
            }

            resetForm();
            renderAdminList();

        } catch (error) {
            console.error('오류 발생:', error);
            alert('파일 처리 중 오류가 발생했습니다.');
        }
    });

    function renderAdminList() {
        const items = getSafeItems();
        const itemList = document.getElementById('itemList');
        itemList.innerHTML = '';

        if (items.length === 0) {
            itemList.innerHTML = '<div style="text-align:center; color:#888; font-size:13px; padding:20px;">등록된 작품이 없습니다.</div>';
            return;
        }

        items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <div class="item-info">
                    <img src="${item.image || 'https://via.placeholder.com/40'}" alt="">
                    <span>${item.title} (${item.mainCat}) [${item.viewType === 'tistory' ? '티스토리' : '파일'}]</span>
                </div>
                <div class="item-actions">
                    <button class="btn-edit" onclick="editItem(${item.id})">수정</button>
                    <button class="btn-del" onclick="deleteItem(${item.id})">삭제</button>
                </div>
            `;
            itemList.appendChild(row);
        });
    }

    function editItem(id) {
        const items = getSafeItems();
        const item = items.find(i => Number(i.id) === Number(id));

        if (item) {
            editIdInput.value = item.id;
            removeConsultImageFlag.value = 'false';
            titleInput.value = item.title;
            descInput.value = item.description;
            mainCatInput.value = item.mainCat;
            subCatInput.value = item.subCat;
            detailUrlInput.value = item.detailUrl;

            const targetViewType = item.viewType || 'file';
            document.querySelector(`input[name="viewType"][value="${targetViewType}"]`).checked = true;
            toggleType(targetViewType);

            consultFileInput.value = '';
            bannerFileInput.value = '';
            thumbFileInput.value = '';

            formTitle.innerText = '작품 정보 수정';
            submitBtn.innerText = '수정 완료';
            cancelBtn.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function resetForm() {
        editIdInput.value = '';
        removeConsultImageFlag.value = 'false';
        titleInput.value = '';
        descInput.value = '';
        mainCatInput.value = 'WEB';
        subCatInput.value = 'BANNER';
        detailUrlInput.value = 'https://';
        document.querySelector('input[name="viewType"][value="file"]').checked = true;
        toggleType('file');

        consultFileInput.value = '';
        bannerFileInput.value = '';
        thumbFileInput.value = '';

        formTitle.innerText = '작품 업로드';
        submitBtn.innerText = '등록하기';
        cancelBtn.style.display = 'none';
    }

    function deleteItem(id) {
        if (confirm('이 작품을 삭제하시겠습니까?')) {
            let items = getSafeItems();
            items = items.filter(item => Number(item.id) !== Number(id));
            localStorage.setItem('bybrudi_portfolio', JSON.stringify(items));
            renderAdminList();
        }
    }

    renderAdminList();
</script>
</body>
</html>
