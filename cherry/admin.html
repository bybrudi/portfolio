<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BY BRUDI - Admin Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #7A0C1E; 
            color: #FFFDF9; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 40px 20px; 
            overflow-x: hidden;
        }

        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #7A0C1E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .lock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: slowAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slowAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .home-link {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255, 253, 249, 0.7);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease;
            margin-bottom: 6px;
        }

        .home-link:hover { color: #FFFDF9; }
        .lock-icon { font-size: 15px; line-height: 1; letter-spacing: normal; }

        .pin-dots { display: flex; gap: 16px; align-items: center; }
        .pin-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 253, 249, 0.4);
            background: transparent;
            transition: all 0.25s ease;
        }

        .pin-dot.filled {
            background: #900f24;
            border-color: #900f24;
            transform: scale(1.1);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .pin-dots.shake { animation: shake 0.4s ease-in-out; }

        #pinInput { position: absolute; opacity: 0; pointer-events: none; }

        #adminDashboard {
            width: 100%;
            max-width: 650px;
            opacity: 0;
            display: none;
            transition: opacity 0.8s ease;
        }

        #adminDashboard.unlocked { display: block; opacity: 1; }

        .admin-card { background: #fff; border-radius: 16px; padding: 32px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); color: #1d1d1f; }
        h2 { font-size: 20px; margin-bottom: 24px; color: #1d1d1f; text-align: center; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 600; color: #6e6e73; display: block; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; outline: none; background: #fff; font-family: inherit; color: #1d1d1f; }
        
        .btn-submit { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 10px; background: #888; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; display: none; }
        
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 12px 16px; border-radius: 8px; border: 1px solid #eee; }
        .item-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .item-info img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .item-details { display: flex; flex-direction: column; overflow: hidden; }
        .item-details a { font-size: 13px; color: #0071e3; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-edit { background: #0071e3; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-del { background: #ff3b30; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body onclick="document.getElementById('pinInput').focus()">

    <div id="lockScreen">
        <div class="lock-container">
            <a href="/" class="home-link">CLICK HERE</a>
            <div class="lock-icon">🔒</div>
            <div class="pin-dots" id="pinDots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
        </div>
        <input type="password" id="pinInput" maxlength="6" autofocus>
    </div>

    <div id="adminDashboard">
        <div class="admin-wrap">
            <div class="admin-card">
                <h2 id="formTitle">작품 업로드 (GitHub 연동형)</h2>
                <form id="uploadForm">
                    <input type="hidden" id="editId">
                    
                    <div class="form-group">
                        <label>대카테고리</label>
                        <select id="mainCat">
                            <option value="WEB">WEB</option>
                            <option value="PRINT">PRINT</option>
                            <option value="OTHER">OTHER</option>
                            <option value="PRICE">PRICE</option>
                            <option value="CONTACT">CONTACT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>소카테고리 (WEB 선택 시)</label>
                        <select id="subCat">
                            <option value="BANNER">BANNER</option>
                            <option value="DETAIL">DETAIL</option>
                            <option value="PHOTO">PHOTO</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>시안 이미지 주소 링크 입력 (티스토리 이미지 원본 URL)</label>
                        <input type="text" id="imageUrl" placeholder="https://img1.daumcdn.net/..." required>
                    </div>

                    <div class="form-group">
                        <label>업로드 내용 (티스토리 포스팅 상세 링크 URL)</label>
                        <input type="text" id="tistoryUrl" placeholder="https://bybrudi.tistory.com/entry/..." required>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">저장하기</button>
                    <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">수정 취소</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>등록된 작품 목록</h2>
                <div class="item-list" id="itemList">동기화 중...</div>
            </div>
        </div>
    </div>

<script>


        // 🔑 깃허브 연동 설정
        const GITHUB_USERNAME = "bybrudi";
        const REPO_NAME = "portfolio";
        const FILE_PATH = "cherry/data.json"; // cherry 폴더 안의 data.json 경로 정렬
        const ADMIN_PIN = "202610";

        // 📌 works.html과 완벽히 일치하는 카테고리 맵핑
        const subCategoryMap = {
            DEVELOP: ['DEVELOP', 'CAFE24'],
            WEB: ['BANNER', 'DETAIL', 'CARD', 'AD+'],
            PRINT: ['EDITORIAL', 'PACKAGING'],
            OTHER: ['SPACE&3D', 'PHOTO', 'EDIT', 'video']
        };

        let currentSha = "";
        let portfolioData = [];

        const pinInput = document.getElementById('pinInput');
        const pinDots = document.querySelectorAll('.pin-dot');
        const lockScreen = document.getElementById('lockScreen');
        const adminDashboard = document.getElementById('adminDashboard');

        // 화면 클릭 시 비밀번호 입력 포커스 유지
        window.addEventListener('click', () => {
            if(!lockScreen.classList.contains('is-hidden')) pinInput.focus();
        });

        // 🔓 6자리 비밀번호(202610) 검증 로직
        pinInput.addEventListener('input', (e) => {
            const val = pinInput.value;
            pinDots.forEach((dot, idx) => {
                if (idx < val.length) dot.classList.add('active');
                else dot.classList.remove('active');
            });

            if (val.length === 6) {
                if (val === ADMIN_PIN) {
                    lockScreen.classList.add('is-hidden');
                    adminDashboard.classList.add('active');
                    updateSubCategories(); // 대카테고리 기본 소팅
                    fetchFromGithub();     // 깃허브 데이터 로드
                } else {
                    alert('비밀번호가 올바르지 않습니다.');
                    pinInput.value = '';
                    pinDots.forEach(dot => dot.classList.remove('active'));
                }
            }
        });

        // 🔄 대카테고리 선택에 따른 소카테고리 자동 변경 연동 함수
        function updateSubCategories() {
            const mainCat = document.getElementById('mainCat').value;
            const subSelect = document.getElementById('subCat');
            subSelect.innerHTML = '';

            const subs = subCategoryMap[mainCat] || [];
            subs.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = sub;
                subSelect.appendChild(opt);
            });
        }

        // 🔑 깃허브 토큰 인증 관리
        function getGithubToken() {
            let token = sessionStorage.getItem('gh_token');
            if (!token) {
                token = prompt("GitHub Personal Access Token (repo 권한)을 입력해 주세요:");
                if (token) sessionStorage.setItem('gh_token', token.trim());
            }
            return token;
        }

        // 🌐 깃허브 data.json 불러오기
        async function fetchFromGithub() {
            const token = getGithubToken();
            if (!token) return;

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentSha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    portfolioData = JSON.parse(content || '[]');
                    renderList();
                } else {
                    alert('GitHub 데이터를 불러오지 못했습니다. 토큰 권한을 확인하세요.');
                    sessionStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 💾 깃허브 data.json 저장하기
        async function saveToGithub() {
            const token = getGithubToken();
            if (!token) return;

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            const jsonString = JSON.stringify(portfolioData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const payload = {
                message: "Update portfolio data via Admin",
                content: encodedContent,
                sha: currentSha
            };

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const resData = await res.json();
                    currentSha = resData.content.sha;
                    alert('GitHub 서버에 성공적으로 동기화 저장되었습니다! 🎉');
                    renderList();
                } else {
                    alert('저장 실패: GitHub 토큰 권한을 확인하세요.');
                    sessionStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
                alert('네트워크 오류가 발생했습니다.');
            }
        }

        // ➕ 등록 폼 제출
        function handleSave(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                mainCat: document.getElementById('mainCat').value,
                subCat: document.getElementById('subCat').value,
                imageUrl: document.getElementById('imageUrl').value,
                tistoryUrl: document.getElementById('tistoryUrl').value
            };

            portfolioData.unshift(newItem);
            saveToGithub();

            document.getElementById('imageUrl').value = '';
            document.getElementById('tistoryUrl').value = '';
        }

        // 🗑️ 항목 삭제
        function deleteItem(id) {
            if (confirm('해당 작품을 삭제하시겠습니까?')) {
                portfolioData = portfolioData.filter(item => item.id !== id);
                saveToGithub();
            }
        }

        // 📋 관리자 목록 렌더링
        function renderList() {
            const listArea = document.getElementById('itemList');
            listArea.innerHTML = '';

            if (portfolioData.length === 0) {
                listArea.innerHTML = '<div style="color: #999; font-size: 13px; text-align: center; padding: 20px;">등록된 작품이 없습니다.</div>';
                return;
            }

            portfolioData.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <span><strong>[${item.mainCat}]</strong> ${item.subCat}</span>
                    <button class="btn-del" onclick="deleteItem(${item.id})">&times;</button>
                `;
                listArea.appendChild(row);
            });
        }
    </script>
</body>
</html>
