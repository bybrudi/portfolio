<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BY BRUDI - Admin Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            
            color: #FFFDF9; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 40px 20px; 
            overflow-x: hidden;
        }

        #lockScreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #7A0C1E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .lock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: slowAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slowAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .home-link {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255, 253, 249, 0.7);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease;
            margin-bottom: 6px;
        }

        .home-link:hover { color: #FFFDF9; }
        .lock-icon { font-size: 15px; line-height: 1; letter-spacing: normal; }

        .pin-dots { display: flex; gap: 16px; align-items: center; }
        .pin-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 253, 249, 0.4);
            background: transparent;
            transition: all 0.25s ease;
        }

        .pin-dot.filled {
            background: #900f24;
            border-color: #900f24;
            transform: scale(1.1);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .pin-dots.shake { animation: shake 0.4s ease-in-out; }

        #pinInput { position: absolute; opacity: 0; pointer-events: none; }

        #adminDashboard {
            width: 100%;
            max-width: 650px;
            opacity: 0;
            display: none;
            transition: opacity 0.8s ease;
        }

        #adminDashboard.unlocked { display: block; opacity: 1; }

        .admin-card { background: #fff; border-radius: 16px; padding: 32px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); color: #1d1d1f; }
        h2 { font-size: 20px; margin-bottom: 24px; color: #1d1d1f; text-align: center; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 600; color: #6e6e73; display: block; margin-bottom: 8px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 14px; outline: none; background: #fff; font-family: inherit; color: #1d1d1f; }
        
        .btn-submit { width: 100%; padding: 14px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 10px; background: #888; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; display: none; }
        
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 12px 16px; border-radius: 8px; border: 1px solid #eee; }
        .item-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .item-info img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .item-details { display: flex; flex-direction: column; overflow: hidden; }
        .item-details a { font-size: 13px; color: #0071e3; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-edit { background: #0071e3; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .btn-del { background: #ff3b30; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body onclick="document.getElementById('pinInput').focus()">

    <div id="lockScreen">
        <div class="lock-container">
            <a href="/" class="home-link">CLICK HERE</a>
            <div class="lock-icon">🔒</div>
            <div class="pin-dots" id="pinDots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
        </div>
        <input type="password" id="pinInput" maxlength="6" autofocus>
    </div>

    <div id="adminDashboard">
        <div class="admin-wrap">
            <div class="admin-card">
                <h2 id="formTitle">작품 업로드 (GitHub 연동형)</h2>
                <form id="uploadForm" onsubmit="handleSave(event)">
                    <input type="hidden" id="editId">
                    
                    <div class="form-group">
                        <label>대카테고리</label>
                        <select id="mainCat" onchange="updateSubCategories()">
                            <option value="DEVELOP">DEVELOP</option>
                            <option value="WEB">WEB</option>
                            <option value="PRINT">PRINT</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>소카테고리</label>
                        <select id="subCat">
                            <!-- 자바스크립트로 동적 생성됨 -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>시안 이미지 주소 링크 입력 (티스토리 이미지 원본 URL)</label>
                        <input type="text" id="imageUrl" placeholder="https://img1.daumcdn.net/..." required>
                    </div>

                    <div class="form-group">
                        <label>업로드 내용 (티스토리 포스팅 상세 링크 URL)</label>
                        <input type="text" id="tistoryUrl" placeholder="https://bybrudi.tistory.com/entry/..." required>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">저장하기</button>
                    <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">수정 취소</button>
                </form>
            </div>

            <div class="admin-card">
                <h2>등록된 작품 목록</h2>
                <div class="item-list" id="itemList">동기화 중...</div>
            </div>
        </div>
    </div>

    <script>
        // 🔑
        const GITHUB_USERNAME = "bybrudi";
        const REPO_NAME = "portfolio";
        const FILE_PATH = "/data.json"; 
        
        const ADMIN_PIN = "202610";

        // 📌 카테고리 매핑
        const subCategoryMap = {
            DEVELOP: ['DEVELOP', 'CAFE24'],
            WEB: ['BANNER', 'DETAIL', 'CARD', 'AD+'],
            PRINT: ['EDITORIAL', 'PACKAGING'],
            OTHER: ['SPACE&3D', 'PHOTO', 'EDIT', 'video']
        };

        const pinInput = document.getElementById('pinInput');
        const pinDots = document.getElementById('pinDots');
        const dots = pinDots.querySelectorAll('.pin-dot');
        const lockScreen = document.getElementById('lockScreen');
        const adminDashboard = document.getElementById('adminDashboard');

        let currentSha = "";
        let portfolioData = [];

        // 🔓 핀번호(202610) 잠금 해제 및 도트 애니메이션 처리
        pinInput.addEventListener('input', (e) => {
            const val = pinInput.value;
            dots.forEach((dot, idx) => {
                if (idx < val.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });

            if (val.length === 6) {
                if (val === ADMIN_PIN) {
                    lockScreen.style.opacity = '0';
                    setTimeout(() => {
                        lockScreen.style.display = 'none';
                        adminDashboard.classList.add('unlocked');
                        updateSubCategories();
                        fetchFromGithub();
                    }, 600);
                } else {
                    pinDots.classList.add('shake');
                    setTimeout(() => {
                        pinDots.classList.remove('shake');
                        pinInput.value = '';
                        dots.forEach(dot => dot.classList.remove('filled'));
                    }, 400);
                }
            }
        });

        // 🔄 대카테고리 변경 시 소카테고리 동적 업데이트
        function updateSubCategories() {
            const mainCat = document.getElementById('mainCat').value;
            const subSelect = document.getElementById('subCat');
            subSelect.innerHTML = '';

            const subs = subCategoryMap[mainCat] || [];
            subs.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = sub;
                subSelect.appendChild(opt);
            });
        }

        // 🔑 깃허브 토큰 관리
        function getGithubToken() {
            let token = sessionStorage.getItem('gh_token');
            if (!token) {
                token = prompt("GitHub Personal Access Token (repo 권한)을 입력해 주세요:");
                if (token) sessionStorage.setItem('gh_token', token.trim());
            }
            return token;
        }

        // 🌐 깃허브에서 data.json 가져오기
        async function fetchFromGithub() {
            const token = getGithubToken();
            if (!token) return;

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentSha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    portfolioData = JSON.parse(content || '[]');
                    renderList();
                } else {
                    alert('GitHub 데이터를 불러오지 못했습니다. 토큰 권한을 확인하세요.');
                    sessionStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 💾 깃허브 data.json 동기화 저장
        async function saveToGithub() {
            const token = getGithubToken();
            if (!token) return;

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            const jsonString = JSON.stringify(portfolioData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const payload = {
                message: "Update portfolio data via Admin",
                content: encodedContent,
                sha: currentSha
            };

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const resData = await res.json();
                    currentSha = resData.content.sha;
                    alert('GitHub 서버에 성공적으로 동기화 저장되었습니다! 🎉');
                    resetForm();
                    renderList();
                } else {
                    alert('저장 실패: GitHub 토큰 권한을 확인하세요.');
                    sessionStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
                alert('네트워크 오류가 발생했습니다.');
            }
        }

        // ➕ 저장 및 수정 처리
        function handleSave(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const mainCat = document.getElementById('mainCat').value;
            const subCat = document.getElementById('subCat').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const tistoryUrl = document.getElementById('tistoryUrl').value;

            if (editId) {
                // 수정 모드
                const idx = portfolioData.findIndex(item => item.id == editId);
                if (idx !== -1) {
                    portfolioData[idx] = { id: Number(editId), mainCat, subCat, imageUrl, tistoryUrl };
                }
            } else {
                // 신규 등록
                const newItem = { id: Date.now(), mainCat, subCat, imageUrl, tistoryUrl };
                portfolioData.unshift(newItem);
            }

            saveToGithub();
        }

        // ✏️ 수정 모드 세팅
        function editItem(id) {
            const item = portfolioData.find(i => i.id == id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('mainCat').value = item.mainCat;
            updateSubCategories();
            document.getElementById('subCat').value = item.subCat;
            document.getElementById('imageUrl').value = item.imageUrl;
            document.getElementById('tistoryUrl').value = item.tistoryUrl;

            document.getElementById('formTitle').innerText = '작품 정보 수정';
            document.getElementById('submitBtn').innerText = '수정 완료';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 🔄 폼 초기화
        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('uploadForm').reset();
            updateSubCategories();
            document.getElementById('formTitle').innerText = '작품 업로드 (GitHub 연동형)';
            document.getElementById('submitBtn').innerText = '저장하기';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // 🗑️ 항목 삭제
        function deleteItem(id) {
            if (confirm('해당 작품을 삭제하시겠습니까?')) {
                portfolioData = portfolioData.filter(item => item.id != id);
                saveToGithub();
            }
        }

        // 📋 등록된 작품 리스트 렌더링
        function renderList() {
            const listArea = document.getElementById('itemList');
            listArea.innerHTML = '';

            if (portfolioData.length === 0) {
                listArea.innerHTML = '<div style="color:#888; font-size:13px; text-align:center; padding:20px;">등록된 작품이 없습니다.</div>';
                return;
            }

            portfolioData.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div class="item-info">
                        <img src="${item.imageUrl || 'https://via.placeholder.com/40'}" alt="썸네일">
                        <div class="item-details">
                            <strong>[${item.mainCat}] ${item.subCat}</strong>
                            <a href="${item.tistoryUrl}" target="_blank">${item.tistoryUrl}</a>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-edit" onclick="editItem(${item.id})">수정</button>
                        <button class="btn-del" onclick="deleteItem(${item.id})">삭제</button>
                    </div>
                `;
                listArea.appendChild(row);
            });
        }
    </script>
</body>
</html>
