<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYBRUDI Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .admin-card { background: #1c1c1e; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; border: 1px solid #2c2c2e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; color: #fff; letter-spacing: 1px; }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 600; color: #a1a1a6; }
        input, select { width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: #8B0017; }
        
        .btn-submit { width: 100%; padding: 14px; background: #8B0017; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background: #a5001c; }

        /* 잠금 화면 */
        .lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .pin-box { display: flex; gap: 10px; margin-top: 20px; }
        .pin-dot { width: 12px; height: 12px; border-radius: 50%; background: #3a3a3c; }
        .pin-dot.active { background: #8B0017; }
        .pin-input { position: absolute; opacity: 0; pointer-events: none; }

        /* 기존 등록 목록 */
        .item-list { margin-top: 30px; border-top: 1px solid #2c2c2e; padding-top: 20px; max-height: 250px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #2c2c2e; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
        .btn-del { background: #ff3b30; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <!-- 🔒 핀번호 잠금 화면 -->
    <div class="lock-screen" id="lockScreen">
        <h2>ADMIN ACCESS</h2>
        <p style="font-size: 12px; color: #a1a1a6;">6자리 PIN 번호를 입력하세요.</p>
        <div class="pin-box">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <input type="password" id="pinInput" class="pin-input" maxlength="6" autofocus>
    </div>

    <!-- 🛠️ 어드민 대시보드 -->
    <div class="admin-card" id="adminDashboard" style="display: none;">
        <h2>작품 업로드</h2>
        
        <form id="uploadForm" onsubmit="handleSave(event)">
            <div class="form-group">
                <label>대카테고리</label>
                <select id="mainCat" onchange="updateSubCategories()">
                    <option value="DEVELOP">DEVELOP</option>
                    <option value="WEB">WEB</option>
                    <option value="PRINT">PRINT</option>
                    <option value="OTHER">OTHER</option>
                </select>
            </div>

            <div class="form-group">
                <label>소카테고리</label>
                <select id="subCat">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </select>
            </div>

            <div class="form-group">
                <label>이미지 URL (시안 링크)</label>
                <input type="text" id="imageUrl" placeholder="https://..." required>
            </div>

            <div class="form-group">
                <label>티스토리 상세페이지 URL</label>
                <input type="text" id="tistoryUrl" placeholder="https://brudi.tistory.com/..." required>
            </div>

            <button type="submit" class="btn-submit">GitHub 동기화 저장</button>
        </form>

        <h2 style="margin-top: 30px; text-align: left;">등록된 작품 목록</h2>
        <div class="item-list" id="itemList">동기화 중...</div>
    </div>

    <script>
        // 🔑 GitHub 기본 정보 설정
        const GITHUB_USERNAME = "bybrudi";
        const REPO_NAME = "portfolio";
        const FILE_PATH = "data.json";
        const ADMIN_PIN = "202610";

        // 📌 works.html과 동일한 소카테고리 데이터 구조
        const subCategoryMap = {
            DEVELOP: ['DEVELOP', 'CAFE24'],
            WEB: ['BANNER', 'DETAIL', 'CARD', 'AD+'],
            PRINT: ['EDITORIAL', 'PACKAGING'],
            OTHER: ['SPACE&3D', 'PHOTO', 'EDIT', 'video']
        };

        const pinInput = document.getElementById('pinInput');
        const pinDots = document.querySelectorAll('.pin-dot');
        const lockScreen = document.getElementById('lockScreen');
        const adminDashboard = document.getElementById('adminDashboard');

        let currentSha = "";
        let portfolioData = [];

        // 화면 클릭 시 PIN 입력창에 포커스 유지
        window.addEventListener('click', () => { if(lockScreen.style.display !== 'none') pinInput.focus(); });

        // 🔓 PIN 번호 검증
        pinInput.addEventListener('input', (e) => {
            const val = pinInput.value;
            pinDots.forEach((dot, index) => {
                if (index < val.length) dot.classList.add('active');
                else dot.classList.remove('active');
            });

            if (val.length === 6) {
                if (val === ADMIN_PIN) {
                    lockScreen.style.display = 'none';
                    adminDashboard.style.display = 'block';
                    updateSubCategories(); // 카테고리 초기 세팅
                    initGitHubData();
                } else {
                    alert('PIN 번호가 올바르지 않습니다.');
                    pinInput.value = '';
                    pinDots.forEach(dot => dot.classList.remove('active'));
                }
            }
        });

        // 🔄 대카테고리에 따라 소카테고리 드롭다운 변경
        function updateSubCategories() {
            const mainCat = document.getElementById('mainCat').value;
            const subSelect = document.getElementById('subCat');
            subSelect.innerHTML = '';

            const subs = subCategoryMap[mainCat] || [];
            subs.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = sub;
                subSelect.appendChild(opt);
            });
        }

        // 🔑 토큰 관리
        function getGithubToken() {
            let token = sessionStorage.getItem('gh_token');
            if (!token) {
                token = prompt("GitHub Personal Access Token을 입력해 주세요:");
                if (token) sessionStorage.setItem('gh_token', token.trim());
            }
            return token;
        }

        // 🌐 GitHub data.json 불러오기
        async function fetchFromGithub() {
            const token = getGithubToken();
            if (!token) return;

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentSha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    portfolioData = JSON.parse(content || '[]');
                    renderList();
                } else {
                    alert('GitHub 데이터를 불러오지 못했습니다. 토큰 권한을 확인하세요.');
                    sessionStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 💾 GitHub data.json 저장하기
        async function saveToGithub() {
            const token = getGithubToken();
            if (!token) return;

            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
            const jsonString = JSON.stringify(portfolioData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const payload = {
                message: "Update portfolio data via Admin",
                content: encodedContent,
                sha: currentSha
            };

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const resData = await res.json();
                    currentSha = resData.content.sha;
                    alert('GitHub 서버에 성공적으로 동기화 저장되었습니다! 🎉');
                    renderList();
                } else {
                    alert('저장 실패: GitHub 토큰 권한을 확인하세요.');
                    sessionStorage.removeItem('gh_token');
                }
            } catch (err) {
                console.error(err);
                alert('네트워크 오류가 발생했습니다.');
            }
        }

        function initGitHubData() {
            fetchFromGithub();
        }

        // ➕ 신규 데이터 추가
        function handleSave(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                mainCat: document.getElementById('mainCat').value,
                subCat: document.getElementById('subCat').value,
                imageUrl: document.getElementById('imageUrl').value,
                tistoryUrl: document.getElementById('tistoryUrl').value
            };

            portfolioData.unshift(newItem); // 최신 항목 맨 앞으로
            saveToGithub();

            document.getElementById('imageUrl').value = '';
            document.getElementById('tistoryUrl').value = '';
        }

        // 🗑️ 데이터 삭제
        function deleteItem(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                portfolioData = portfolioData.filter(item => item.id !== id);
                saveToGithub();
            }
        }

        // 📋 목록 렌더링
        function renderList() {
            const listArea = document.getElementById('itemList');
            listArea.innerHTML = '';

            if (portfolioData.length === 0) {
                listArea.innerHTML = '<div style="color:#777; font-size:12px;">등록된 데이터가 없습니다.</div>';
                return;
            }

            portfolioData.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div>
                        <strong>[${item.mainCat}] ${item.subCat}</strong>
                    </div>
                    <button class="btn-del" onclick="deleteItem(${item.id})">삭제</button>
                `;
                listArea.appendChild(row);
            });
        }
    </script>
</body>
</html>
